<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Voice note</title>
<style>
  html,body{margin:0;height:100%;background:#0f172a;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px;box-sizing:border-box;text-align:center}
  h1{font-size:30px;font-weight:700;margin:0;line-height:1.2}
  #btn{width:min(70vw,280px);height:min(70vw,280px);border-radius:50%;border:0;background:#16a34a;color:#fff;
       font-size:30px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
       box-shadow:0 10px 40px rgba(22,163,74,.45);cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  #btn:active{transform:scale(.97)}
  #btn[disabled]{background:#475569;box-shadow:none}
  #btn.playing{background:#dc2626;box-shadow:0 10px 40px rgba(220,38,38,.45)}
  #icon{font-size:84px;line-height:1}
  #status{font-size:22px;color:#cbd5e1;min-height:1.4em}
  #bar{width:min(80vw,360px);height:10px;background:#334155;border-radius:5px;overflow:hidden}
  #fill{height:100%;width:0;background:#22c55e}
</style>
</head>
<body>
<main>
  <h1 id="title">Voice note from Devon</h1>
  <button id="btn" disabled aria-label="Play"><span id="icon">⏳</span><span id="lbl">Loading…</span></button>
  <div id="bar"><div id="fill"></div></div>
  <div id="status"></div>
  <audio id="a" preload="auto" playsinline></audio>
</main>
<script>
(function(){
  var btn=document.getElementById('btn'), icon=document.getElementById('icon'), lbl=document.getElementById('lbl'),
      st=document.getElementById('status'), fill=document.getElementById('fill'), a=document.getElementById('a');
  var p={}; location.hash.replace(/^#/,'').split('&').forEach(function(kv){var i=kv.indexOf('=');if(i>0)p[kv.slice(0,i)]=decodeURIComponent(kv.slice(i+1));});
  if(p.n){document.getElementById('title').textContent='Voice note from '+p.n.slice(0,40);}
  function fmt(s){if(!isFinite(s)||s<=0)return'';s=Math.round(s);return Math.floor(s/60)+':'+('0'+(s%60)).slice(-2);}
  function setIdle(){btn.disabled=false;btn.className='';icon.textContent='▶';lbl.textContent='Play';}
  function fail(msg){btn.disabled=true;icon.textContent='⚠️';lbl.textContent='';st.textContent=msg;window.__vnError=msg;}
  if(p.d){st.textContent=fmt(+p.d);}
  function b64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),o=new Uint8Array(b.length);for(var i=0;i<b.length;i++)o[i]=b.charCodeAt(i);return o;}
  if(!p.u||!p.k){fail('This link is incomplete.');return;}
  var url=/^https:\/\//.test(p.u)?p.u:'https://files.catbox.moe/'+p.u.replace(/[^A-Za-z0-9._-]/g,'');
  if(!(window.crypto&&crypto.subtle)){fail('Please open this link in Safari or Chrome.');return;}
  fetch(url,{cache:'force-cache',credentials:'omit',referrerPolicy:'no-referrer'}).then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);return r.arrayBuffer();
  }).then(function(buf){
    var raw=new Uint8Array(buf);
    return crypto.subtle.importKey('raw',b64u(p.k),{name:'AES-GCM'},false,['decrypt']).then(function(key){
      return crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(0,12)},key,raw.slice(12));
    });
  }).then(function(plain){
    a.src=URL.createObjectURL(new Blob([plain],{type:'audio/mp4'}));
    a.load(); setIdle(); window.__vnReady=true;
  }).catch(function(e){fail('Sorry, this voice note could not be loaded.');console.error(e);});
  a.addEventListener('loadedmetadata',function(){if(isFinite(a.duration))st.textContent=fmt(a.duration);});
  a.addEventListener('timeupdate',function(){if(a.duration)fill.style.width=(100*a.currentTime/a.duration)+'%';
    st.textContent=fmt(a.currentTime||0.001)+' / '+fmt(a.duration);});
  a.addEventListener('ended',function(){setIdle();icon.textContent='↻';lbl.textContent='Play again';fill.style.width='100%';});
  a.addEventListener('pause',function(){if(!a.ended)setIdle();});
  a.addEventListener('play',function(){btn.className='playing';icon.textContent='❚❚';lbl.textContent='Pause';});
  a.addEventListener('error',function(){fail('Sorry, this phone could not play the voice note.');});
  btn.addEventListener('click',function(){
    if(a.paused){var pr=a.play();if(pr&&pr.catch)pr.catch(function(){st.textContent='Tap Play again';});}else a.pause();
  });
})();
</script>
</body>
</html>
